spring:
  application:
    name: space-exploration-article-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: ${PORT:8080}
  servlet:
     context-path: /api

app:
  security:
    # Set JWT_SECRET to the same 32+ byte HMAC secret used by the authentication service.
    jwt-secret: ${JWT_SECRET:local-development-secret-change-this-to-at-least-32-bytes}
